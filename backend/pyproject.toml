[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shuttlevision-backend"
version = "0.1.0"
description = "ShuttleVision AI badminton analysis backend"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
